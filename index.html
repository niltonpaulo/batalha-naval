<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Batalha Naval - Navio x Submarino</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #041019;
    width: 100%; height: 100%;
    touch-action: none;
  }
  #game-container {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #rotate-msg {
    position: fixed; inset: 0;
    background: #041019; color: #cfe8ff;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; font-family: sans-serif;
    z-index: 999; padding: 20px;
  }
  @media (orientation: portrait) {
    #rotate-msg { display: flex; }
    #game-container { display: none; }
  }
  #fullscreen-btn {
    position: fixed; top: 10px; right: 10px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.5);
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    font-family: sans-serif;
  }
</style>
</head>
<body>
<div id="rotate-msg">
  <div style="font-size:48px;">🔄</div>
  <p>Gire o celular para o modo paisagem<br>para jogar</p>
</div>
<button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
<div id="game-container"></div>
<script>
  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<script>
const GAME_W = 800;
const GAME_H = 450;
const WATER_Y = 225;
const SHIP_Y = 205;
const SUB_Y = 400;
const WIN_SCORE = 5;
const SUN_X = 610, SUN_Y = 165;

class BattleScene extends Phaser.Scene {
  constructor() { super('BattleScene'); }

  create() {
    // ================= SKY (dramatic sunset gradient) =================
    const sky = this.add.graphics();
    sky.fillGradientStyle(0x140a2e, 0x140a2e, 0xff7a3d, 0xffb35c, 1);
    sky.fillRect(0, 0, GAME_W, WATER_Y);

    // Distant dark clouds (behind sun)
    this.clouds = [];
    const cloudDefs = [
      {x:100, y:55, rx:90, ry:22, color:0x2c1b40, alpha:0.55, speed:2},
      {x:300, y:35, rx:70, ry:16, color:0x3a2350, alpha:0.45, speed:3},
      {x:520, y:80, rx:110, ry:24, color:0x35204a, alpha:0.5, speed:1.5},
      {x:700, y:50, rx:80, ry:18, color:0x2c1b40, alpha:0.5, speed:2.5},
      {x:180, y:120, rx:130, ry:20, color:0xff9d6b, alpha:0.35, speed:4},
      {x:480, y:135, rx:150, ry:22, color:0xffb385, alpha:0.3, speed:3.5}
    ];
    cloudDefs.forEach(c => {
      const e = this.add.ellipse(c.x, c.y, c.rx*2, c.ry*2, c.color, c.alpha);
      this.clouds.push({obj:e, speed:c.speed});
    });

    // Sun with layered glow
    this.add.circle(SUN_X, SUN_Y, 95, 0xffd27a, 0.12);
    this.add.circle(SUN_X, SUN_Y, 65, 0xffcf7a, 0.22);
    this.add.circle(SUN_X, SUN_Y, 42, 0xffe1a0, 0.4);
    this.add.circle(SUN_X, SUN_Y, 24, 0xfff3cf, 0.9);
    this.add.circle(SUN_X, SUN_Y, 16, 0xfffbe8, 1);

    // ================= WATER SURFACE STRIP =================
    const surf = this.add.graphics();
    surf.fillGradientStyle(0xffb35c, 0xd97a3f, 0x1c5570, 0x123a52, 1);
    surf.fillRect(0, WATER_Y, GAME_W, 55);

    // Sun reflection glitter strip on water
    this.glitterG = this.add.graphics();

    // ================= DEEP SEA =================
    const deepH = GAME_H - (WATER_Y+55);
    const deep = this.add.graphics();
    deep.fillGradientStyle(0x0c3552, 0x0c3552, 0x020c14, 0x020c14, 1);
    deep.fillRect(0, WATER_Y+55, GAME_W, deepH);

    // God rays in deep sea (static soft diagonal beams)
    const rays = this.add.graphics();
    rays.fillStyle(0xbfe8ff, 0.06);
    for (let i=0;i<4;i++){
      const bx = 150 + i*180;
      rays.beginPath();
      rays.moveTo(bx, WATER_Y+55);
      rays.lineTo(bx+70, WATER_Y+55);
      rays.lineTo(bx-40, GAME_H);
      rays.lineTo(bx-140, GAME_H);
      rays.closePath();
      rays.fillPath();
    }

    // ================= WATER LINE (animated waves) =================
    this.waveG = this.add.graphics();

    // ================= ICEBERG (decorative, shaded) =================
    const iceX = GAME_W/2 + 40;
    const iceberg = this.add.graphics();
    // Shadowed left side (above water)
    iceberg.fillStyle(0x9fc7de, 0.95);
    iceberg.beginPath();
    iceberg.moveTo(iceX-40, WATER_Y-25);
    iceberg.lineTo(iceX+10, WATER_Y-58);
    iceberg.lineTo(iceX+15, WATER_Y-15);
    iceberg.lineTo(iceX-30, WATER_Y+8);
    iceberg.closePath();
    iceberg.fillPath();
    // Lit right side (facing sun - warm highlight, above water)
    iceberg.fillStyle(0xfff2da, 0.95);
    iceberg.beginPath();
    iceberg.moveTo(iceX+10, WATER_Y-58);
    iceberg.lineTo(iceX+55, WATER_Y-20);
    iceberg.lineTo(iceX+30, WATER_Y+8);
    iceberg.lineTo(iceX+15, WATER_Y-15);
    iceberg.closePath();
    iceberg.fillPath();
    // Rim light along the peak
    iceberg.lineStyle(2, 0xffe6b0, 0.9);
    iceberg.beginPath();
    iceberg.moveTo(iceX+10, WATER_Y-58);
    iceberg.lineTo(iceX+55, WATER_Y-20);
    iceberg.strokePath();
    // Underwater body - shadow side
    iceberg.fillStyle(0x1c5a78, 0.9);
    iceberg.beginPath();
    iceberg.moveTo(iceX-45, WATER_Y+8);
    iceberg.lineTo(iceX-15, WATER_Y+95);
    iceberg.lineTo(iceX+10, WATER_Y+145);
    iceberg.lineTo(iceX-5, WATER_Y+60);
    iceberg.closePath();
    iceberg.fillPath();
    // Underwater body - lit side
    iceberg.fillStyle(0x3f8fae, 0.85);
    iceberg.beginPath();
    iceberg.moveTo(iceX-5, WATER_Y+60);
    iceberg.lineTo(iceX+10, WATER_Y+145);
    iceberg.lineTo(iceX+45, WATER_Y+75);
    iceberg.lineTo(iceX+30, WATER_Y+8);
    iceberg.closePath();
    iceberg.fillPath();
    // Crack detail lines
    iceberg.lineStyle(1, 0x5fa6c2, 0.6);
    iceberg.beginPath();
    iceberg.moveTo(iceX-10, WATER_Y+20);
    iceberg.lineTo(iceX+5, WATER_Y+70);
    iceberg.strokePath();
    iceberg.beginPath();
    iceberg.moveTo(iceX+20, WATER_Y+30);
    iceberg.lineTo(iceX+12, WATER_Y+90);
    iceberg.strokePath();

    // ================= PLAYER SHIP =================
    this.ship = this.add.container(GAME_W/2 - 150, SHIP_Y);
    const hullG = this.add.graphics();
    hullG.fillGradientStyle(0x5fae5f, 0x5fae5f, 0x1f4d1f, 0x1f4d1f, 1);
    hullG.fillRoundedRect(-50, -12, 100, 22, 4);
    hullG.lineStyle(2, 0x143a14, 1);
    hullG.strokeRoundedRect(-50, -12, 100, 22, 4);
    const cabinG = this.add.graphics();
    cabinG.fillGradientStyle(0x4a8f4a, 0x4a8f4a, 0x244f24, 0x244f24, 1);
    cabinG.fillRoundedRect(-30, -26, 34, 15, 3);
    cabinG.lineStyle(2, 0x143a14, 1);
    cabinG.strokeRoundedRect(-30, -26, 34, 15, 3);
    // lit windows (dusk atmosphere)
    const win1 = this.add.rectangle(-24, -19, 5, 5, 0xffe27a, 1);
    const win2 = this.add.rectangle(-14, -19, 5, 5, 0xffe27a, 1);
    const mast = this.add.rectangle(15, -38, 3, 26, 0x2b2b2b);
    const flag = this.add.triangle(20, -40, 0,0, 12,4, 0,8, 0xdd3333);
    const stack = this.add.rectangle(-2, -30, 10, 14, 0x333333);
    this.smokeParticles = [];
    this.ship.add([hullG,cabinG,win1,win2,mast,flag,stack]);
    this.shipSpeed = 1.5;
    this.shipMinSpeed = -4;
    this.shipMaxSpeed = 4;

    // ================= ENEMY SUBMARINE =================
    this.sub = this.add.container(GAME_W/2 + 150, SUB_Y);
    const subHullG = this.add.graphics();
    subHullG.fillGradientStyle(0x7a7a7a, 0x7a7a7a, 0x2c2c2c, 0x2c2c2c, 1);
    subHullG.fillEllipse(0, 0, 110, 28);
    subHullG.lineStyle(2, 0x1a1a1a, 1);
    subHullG.strokeEllipse(0, 0, 110, 28);
    const towerG = this.add.graphics();
    towerG.fillGradientStyle(0x666666, 0x666666, 0x2c2c2c, 0x2c2c2c, 1);
    towerG.fillRoundedRect(-24, -30, 26, 18, 3);
    towerG.lineStyle(2, 0x1a1a1a, 1);
    towerG.strokeRoundedRect(-24, -30, 26, 18, 3);
    const periscope = this.add.rectangle(-14, -38, 3, 12, 0x1a1a1a);
    const propeller = this.add.circle(56, 0, 6, 0x333333, 0.9);
    const redLight = this.add.circle(-52, 0, 3, 0xff3333, 1);
    this.sub.add([subHullG, towerG, periscope, propeller, redLight]);
    this.subSpeed = -1.2;
    this.subNextSpeedChange = 0;

    // ================= SCORE UI PANEL =================
    const panel = this.add.graphics();
    panel.fillStyle(0x0a1622, 0.55);
    panel.fillRoundedRect(GAME_W/2 - 130, 8, 260, 40, 10);
    panel.lineStyle(1, 0xffd9a0, 0.4);
    panel.strokeRoundedRect(GAME_W/2 - 130, 8, 260, 40, 10);

    this.playerScore = 0;
    this.enemyScore = 0;
    this.scoreText = this.add.text(GAME_W/2, 26, '0  x  0', {
      fontFamily:'sans-serif', fontSize:'24px', color:'#fff6e0', fontStyle:'bold'
    }).setOrigin(0.5);

    this.add.text(GAME_W/2 - 90, 16, 'VOCÊ', {fontFamily:'sans-serif', fontSize:'12px', color:'#a8ffa8'}).setOrigin(0.5,0);
    this.add.text(GAME_W/2 + 90, 16, 'INIMIGO', {fontFamily:'sans-serif', fontSize:'12px', color:'#ffb0b0'}).setOrigin(0.5,0);

    // ---------- Missile in-flight flags ----------
    this.playerMissile = null;
    this.enemyMissile = null;
    this.enemyNextFireTime = 1500;

    // ---------- Bottom control bar ----------
    const barY = GAME_H - 35;
    const barBg = this.add.graphics();
    barBg.fillGradientStyle(0x0a1622, 0x0a1622, 0x040a10, 0x040a10, 0.92);
    barBg.fillRect(0, GAME_H-70, GAME_W, 70);
    barBg.lineStyle(1, 0xffd9a0, 0.25);
    barBg.strokeLineShape(new Phaser.Geom.Line(0, GAME_H-70, GAME_W, GAME_H-70));

    this.btnMinus = this.makeButton(90, barY, '−', 0x3355aa);
    this.btnMinus.on('pointerdown', () => {
      this.shipSpeed = Math.max(this.shipMinSpeed, this.shipSpeed - 1);
    });

    this.speedText = this.add.text(160, barY, 'Velocidade: 1.5', {
      fontFamily:'sans-serif', fontSize:'14px', color:'#dff4ff'
    }).setOrigin(0,0.5);

    this.btnPlus = this.makeButton(330, barY, '+', 0x3355aa);
    this.btnPlus.on('pointerdown', () => {
      this.shipSpeed = Math.min(this.shipMaxSpeed, this.shipSpeed + 1);
    });

    this.paused = false;
    this.btnPause = this.makeButton(420, barY, '⏸', 0xaa8833);
    this.btnPause.on('pointerdown', () => {
      this.paused = !this.paused;
      this.btnPause.label.setText(this.paused ? '▶' : '⏸');
    });

    this.btnFire = this.add.circle(GAME_W - 70, barY, 32, 0xff5533, 0.9).setStrokeStyle(3,0xffe6c0).setInteractive();
    this.add.text(GAME_W - 70, barY, 'FOGO', {fontFamily:'sans-serif', fontSize:'13px', color:'#fff', fontStyle:'bold'}).setOrigin(0.5);
    this.btnFire.on('pointerdown', () => this.playerFire());

    // ---------- Result overlay ----------
    this.resultText = this.add.text(GAME_W/2, GAME_H/2 - 20, '', {
      fontFamily:'sans-serif', fontSize:'40px', color:'#ffffff', fontStyle:'bold'
    }).setOrigin(0.5).setDepth(10);
    this.restartBtn = this.add.rectangle(GAME_W/2, GAME_H/2+40, 170, 50, 0x2196f3)
      .setStrokeStyle(2,0xffffff).setInteractive().setVisible(false).setDepth(10);
    this.restartText = this.add.text(GAME_W/2, GAME_H/2+40, 'JOGAR DE NOVO', {
      fontFamily:'sans-serif', fontSize:'14px', color:'#fff', fontStyle:'bold'
    }).setOrigin(0.5).setVisible(false).setDepth(11);
    this.restartBtn.on('pointerdown', () => this.scene.restart());

    this.gameOver = false;
  }

  makeButton(x, y, label, color) {
    const circle = this.add.circle(x, y, 26, color, 0.9).setStrokeStyle(2, 0xffe6c0).setInteractive();
    const text = this.add.text(x, y, label, {fontFamily:'sans-serif', fontSize:'22px', color:'#fff', fontStyle:'bold'}).setOrigin(0.5);
    circle.label = text;
    return circle;
  }

  playerFire() {
    if (this.gameOver || this.playerMissile || this.paused) return;
    const m = this.add.circle(this.ship.x, SHIP_Y + 14, 6, 0xfff2b0).setStrokeStyle(1,0x995500);
    m.vy = 3.2;
    this.playerMissile = m;
  }

  enemyFire() {
    if (this.gameOver) return;
    if (this.enemyMissile) return;
    const m = this.add.circle(this.sub.x, SUB_Y - 14, 6, 0xffaa33).setStrokeStyle(1,0x664411);
    m.vy = -3.2;
    this.enemyMissile = m;
  }

  hitFlash(container) {
    this.tweens.add({ targets: container, alpha: 0.2, duration: 60, yoyo: true, repeat: 2 });
  }

  endGame(playerWon) {
    if (this.gameOver) return;
    this.gameOver = true;
    this.resultText.setText(playerWon ? 'VITÓRIA! 🏆' : 'DERROTA 💥');
    this.resultText.setColor(playerWon ? '#8aff8a' : '#ff8a8a');
    this.restartBtn.setVisible(true);
    this.restartText.setVisible(true);
  }

  wrapX(obj) {
    if (obj.x > GAME_W + 50) obj.x = -50;
    if (obj.x < -50) obj.x = GAME_W + 50;
  }

  update(time, delta) {
    const dt = delta / 16.67;

    // Cloud drift
    this.clouds.forEach(c => {
      c.obj.x += c.speed * dt * 0.05;
      if (c.obj.x > GAME_W + 100) c.obj.x = -100;
    });

    // Animated wave line at the water surface
    this.waveG.clear();
    this.waveG.lineStyle(3, 0xfff0d0, 0.85);
    this.waveG.beginPath();
    for (let x=0; x<=GAME_W; x+=8) {
      const y = WATER_Y + Math.sin((x*0.04) + time*0.002) * 3;
      if (x===0) this.waveG.moveTo(x,y); else this.waveG.lineTo(x,y);
    }
    this.waveG.strokePath();

    // Sun glitter on water
    this.glitterG.clear();
    for (let i=0;i<10;i++){
      const gx = SUN_X - 60 + i*12 + Math.sin(time*0.003+i)*6;
      const gy = WATER_Y + 8 + i*4 + Math.cos(time*0.004+i)*3;
      const a = 0.3 + 0.3*Math.sin(time*0.006+i*2);
      this.glitterG.fillStyle(0xfff2c0, Math.max(0,a));
      this.glitterG.fillRect(gx, gy, 10, 2);
    }

    this.speedText.setText('Velocidade: ' + this.shipSpeed.toFixed(1));

    if (this.gameOver || this.paused) return;

    // ship movement
    this.ship.x += this.shipSpeed * dt;
    this.wrapX(this.ship);

    // sub AI movement
    if (time > this.subNextSpeedChange) {
      this.subSpeed = Phaser.Math.FloatBetween(-3, 3);
      this.subNextSpeedChange = time + Phaser.Math.Between(1200, 2500);
    }
    this.sub.x += this.subSpeed * dt;
    this.wrapX(this.sub);

    // enemy fire timing
    if (time > this.enemyNextFireTime) {
      this.enemyFire();
      this.enemyNextFireTime = time + Phaser.Math.Between(1800, 3000);
    }

    // player missile travel
    if (this.playerMissile) {
      const m = this.playerMissile;
      m.y += m.vy * dt;
      if (m.y >= SUB_Y) {
        if (Math.abs(m.x - this.sub.x) < 30) {
          this.playerScore++;
          this.scoreText.setText(this.playerScore + '  x  ' + this.enemyScore);
          this.hitFlash(this.sub);
          if (this.playerScore >= WIN_SCORE) this.endGame(true);
        }
        m.destroy();
        this.playerMissile = null;
      }
    }

    // enemy missile travel
    if (this.enemyMissile) {
      const m = this.enemyMissile;
      m.y += m.vy * dt;
      if (m.y <= SHIP_Y) {
        if (Math.abs(m.x - this.ship.x) < 30) {
          this.enemyScore++;
          this.scoreText.setText(this.playerScore + '  x  ' + this.enemyScore);
          this.hitFlash(this.ship);
          if (this.enemyScore >= WIN_SCORE) this.endGame(false);
        }
        m.destroy();
        this.enemyMissile = null;
      }
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: GAME_W,
  height: GAME_H,
  parent: 'game-container',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  backgroundColor: '#140a2e',
  scene: [BattleScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
